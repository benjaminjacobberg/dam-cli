[package]
name = "dam-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dam"
path = "src/main.rs"

[features]
default = []
testing = ["mockall"]

[dev-dependencies]
tempfile = "3"
once_cell = "1"

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
colored = "3.1"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
dirs = "6"
tokio = { version = "1", features = ["process"] }
mockall = { version = "0.13", optional = true }